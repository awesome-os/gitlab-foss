description: Has gitway create a repository directory record the first time an RPC on its routed listener names a repository, once Gitaly has answered OK. Rails only sends it to gitway as gitaly-feature-gitway-record-repositories metadata; nothing in Rails reads it, and Gitaly ignores it. The actor is the repository.
