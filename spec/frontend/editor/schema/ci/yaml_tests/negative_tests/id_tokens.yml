id_token_with_wrong_aud_type:
  id_tokens:
    INVALID_ID_TOKEN:
      aud:
        invalid_prop: invalid

id_token_with_extra_properties:
  id_tokens:
    INVALID_ID_TOKEN:
      aud: 'https://gitlab.com'
      sub: 'not a valid property'

id_token_with_wrong_target_audience_type:
  id_tokens:
    INVALID_ID_TOKEN:
      aud: 'https://gitlab.com'
      target_audience:
        - 'gitlab-artifact-registry'

id_token_with_empty_target_audience:
  id_tokens:
    INVALID_ID_TOKEN:
      aud: 'https://gitlab.com'
      target_audience: ''
