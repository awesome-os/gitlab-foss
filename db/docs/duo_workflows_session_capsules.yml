description: Points to session capsules that Duo Agent Platform clients upload at a
  session boundary, so that the session can resume elsewhere, for example in a new
  CI job, with work that was not pushed. A capsule is a tar archive of a git bundle,
  an uncommitted patch and a manifest, stored in the duo_session_capsules object
  storage location.
