---
# Files of customer packages; kept for the same reasons as packages_packages. Over the 50 GB soft
# limit; partitioning and an index review are tracked in the work item.
exclude:
  reason: indefinite_retention
retention_window: -1
enforcement_strategy: none
enforcing: false
pause_mechanism:
  type: none
work_item: https://gitlab.com/gitlab-org/gitlab/-/work_items/638890
