---
# One row per project per index file (upserted), so bounded. A loose foreign key marks rows
# pending_destruction on project deletion, but no worker removes them yet:
# https://gitlab.com/gitlab-org/gitlab/-/work_items/633765
exclude:
  reason: transient_data
retention_window: -1
enforcement_strategy: none
enforcing: false
pause_mechanism:
  type: none
work_item: https://gitlab.com/gitlab-org/gitlab/-/work_items/629753
