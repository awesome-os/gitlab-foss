---
# Customer package artifacts. Deleted only by user action (UI/API), cleanup policies, or project
# deletion. Age-based deletion would break builds that depend on them.
exclude:
  reason: indefinite_retention
retention_window: -1
enforcement_strategy: none
enforcing: false
pause_mechanism:
  type: none
work_item: https://gitlab.com/gitlab-org/gitlab/-/work_items/629753
