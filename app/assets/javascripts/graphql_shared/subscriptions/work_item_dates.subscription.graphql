subscription issuableDatesUpdated($issuableId: IssuableID!) {
  issuableDatesUpdated(issuableId: $issuableId) {
    ... on WorkItem {
      id
      features {
        startAndDueDate {
          type
          dueDate
          startDate
        }
      }
    }
    ... on Issue {
      id
      dueDate
    }
  }
}
